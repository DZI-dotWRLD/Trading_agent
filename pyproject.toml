[project]
name = "vscp-agent"
version = "0.1.0"
description = "Weekly trading-update automation for VSCP portfolio companies"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "claude-agent-sdk>=0.1.0",
    "pywin32>=306; sys_platform == 'win32'",
    "tzdata>=2024.1",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "recalc: needs LibreOffice or Excel to recalculate workbooks",
    "agent: calls the real Claude API (costs money); run with --run-agent",
]
# faulthandler prints handled COM errors (RPC_E_DISCONNECTED when Excel quits) as "fatal"; they are not.
addopts = "-ra -p no:faulthandler"
pythonpath = ["."]
